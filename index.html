<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkLog Cloud - GitHub Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { 
            font-family: 'Sarabun', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .modal-animate { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#F1F5F9] text-slate-900">
    <div id="root"></div>

    <!-- Firebase Configuration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, deleteDoc, doc, orderBy, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // *** ขั้นตอนสำคัญ: คุณต้องนำค่าจาก Firebase Console ของคุณมาใส่ที่นี่ ***
        // 1. ไปที่ https://console.firebase.google.com/
        // 2. สร้าง Project และสร้าง "Web App"
        // 3. คัดลอก Config มาวางทับด้านล่างนี้
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "your-app.firebaseapp.com",
            projectId: "your-app",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            // เปิดใช้งาน Offline Persistence (ช่วยให้ทำงานได้แม้เน็ตหลุดชั่วคราว)
            enableIndexedDbPersistence(db).catch((err) => {
                if (err.code == 'failed-precondition') {
                    console.warn("Multiple tabs open, persistence can only be enabled in one tab at a time.");
                } else if (err.code == 'unimplemented') {
                    console.warn("The current browser does not support all of the features required to enable persistence");
                }
            });

            window.fb = {
                auth,
                db,
                collection, addDoc, onSnapshot, query, serverTimestamp, deleteDoc, doc, orderBy,
                signInAnonymously, onAuthStateChanged
            };
            console.log("Firebase initialized");
        } catch (e) {
            console.error("Firebase Initialization Error:", e);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const App = () => {
            const [user, setUser] = useState(null);
            const [history, setHistory] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [loading, setLoading] = useState(false);
            const [form, setForm] = useState({ title: '', detail: '', image: null });
            const [search, setSearch] = useState('');
            const [isReady, setIsReady] = useState(false);
            const [error, setError] = useState(null);

            useEffect(() => {
                const interval = setInterval(() => {
                    if (window.fb) {
                        clearInterval(interval);
                        startSession();
                    }
                }, 500);
                return () => clearInterval(interval);
            }, []);

            const startSession = async () => {
                const { auth, db, collection, query, onSnapshot, orderBy, signInAnonymously, onAuthStateChanged } = window.fb;
                
                try {
                    // ล็อกอินแบบไม่ระบุตัวตน
                    await signInAnonymously(auth);
                    
                    onAuthStateChanged(auth, (u) => {
                        setUser(u);
                        setIsReady(true);
                    });

                    const q = query(collection(db, 'work_reports'), orderBy('timestamp', 'desc'));
                    
                    // เพิ่ม Error Callback ใน onSnapshot เพื่อแจ้งเตือนหาก Permission Denied
                    onSnapshot(q, 
                        (snapshot) => {
                            setHistory(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                            setError(null);
                        },
                        (err) => {
                            console.error("Firestore Listen Error:", err);
                            if (err.code === 'permission-denied') {
                                setError("กรุณาตั้งค่า Cloud Firestore ใน Firebase Console และตั้ง Rules เป็นแบบ Public");
                            }
                        }
                    );
                } catch (err) {
                    console.error("Auth failed:", err);
                    setError("ไม่สามารถเชื่อมต่อ Firebase ได้ กรุณาตรวจสอบ Config");
                    setIsReady(true);
                }
            };

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [history, showModal, isReady, error]);

            const handleFile = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setForm({...form, image: reader.result});
                    reader.readAsDataURL(file);
                }
            };

            const handleSave = async () => {
                if (!form.title || !form.image) return alert("กรุณาใส่ชื่อโครงการและรูปภาพ");
                setLoading(true);
                try {
                    const { db, collection, addDoc, serverTimestamp } = window.fb;
                    await addDoc(collection(db, 'work_reports'), {
                        ...form,
                        timestamp: serverTimestamp(),
                        userId: user?.uid || 'anon'
                    });
                    setForm({ title: '', detail: '', image: null });
                    setShowModal(false);
                } catch (e) {
                    alert("บันทึกไม่ได้: " + e.message);
                }
                setLoading(false);
            };

            const handleDelete = async (id) => {
                if (confirm("ยืนยันการลบข้อมูลนี้?")) {
                    try {
                        await window.fb.deleteDoc(window.fb.doc(window.fb.db, 'work_reports', id));
                    } catch (e) {
                        alert("ลบไม่สำเร็จ: " + e.message);
                    }
                }
            };

            const filtered = history.filter(h => h.title?.toLowerCase().includes(search.toLowerCase()));

            if (!isReady) return (
                <div className="h-screen flex items-center justify-center bg-indigo-900 text-white">
                    <div className="text-center">
                        <div className="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin mx-auto mb-4"></div>
                        <p className="font-bold tracking-widest text-xs uppercase opacity-50">Initializing System...</p>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Navigation */}
                    <nav className="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-30 shadow-sm">
                        <div className="flex items-center gap-2">
                            <div className="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-200">
                                <i data-lucide="shield-check" className="w-5 h-5"></i>
                            </div>
                            <div>
                                <h1 className="font-black text-lg leading-none">WORK<span className="text-indigo-600">LOG</span></h1>
                                <p className="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-tighter">Field Monitoring System</p>
                            </div>
                        </div>
                        <div className={`px-3 py-1 rounded-full text-[10px] font-black tracking-widest border ${user ? 'bg-green-50 text-green-600 border-green-200' : 'bg-amber-50 text-amber-600 border-amber-200'}`}>
                            {user ? 'LIVE CLOUD' : 'OFFLINE'}
                        </div>
                    </nav>

                    {error && (
                        <div className="bg-red-500 text-white p-3 text-center text-xs font-bold animate-pulse">
                            ⚠️ {error}
                        </div>
                    )}

                    <main className="flex-1 max-w-2xl mx-auto w-full p-4 space-y-6">
                        {/* Search Bar */}
                        <div className="relative group">
                            <input 
                                type="text" 
                                placeholder="ค้นหาชื่องานหรือโครงการ..." 
                                className="w-full p-4 pl-12 rounded-[1.5rem] border-none shadow-md focus:ring-2 focus:ring-indigo-500 outline-none bg-white transition-all"
                                onChange={(e) => setSearch(e.target.value)}
                            />
                            <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
                        </div>

                        {/* List Area */}
                        <div className="space-y-4 pb-24">
                            {filtered.length === 0 ? (
                                <div className="text-center py-20 opacity-30">
                                    <i data-lucide="layers" className="w-16 h-16 mx-auto mb-4"></i>
                                    <p className="font-bold uppercase text-xs tracking-widest">No Records Found</p>
                                </div>
                            ) : (
                                filtered.map(item => (
                                    <div key={item.id} className="bg-white rounded-[2rem] overflow-hidden shadow-md border border-slate-100 flex flex-col animate-in fade-in duration-500">
                                        <div className="h-56 relative group">
                                            <img src={item.image} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
                                            <button 
                                                onClick={() => handleDelete(item.id)}
                                                className="absolute top-4 right-4 bg-white/90 backdrop-blur p-2 rounded-xl text-red-500 shadow-xl opacity-0 group-hover:opacity-100 transition-opacity"
                                            >
                                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                            </button>
                                        </div>
                                        <div className="p-6">
                                            <h3 className="font-black text-xl text-slate-800">{item.title}</h3>
                                            <p className="text-slate-500 text-sm mt-2 leading-relaxed">{item.detail || 'ไม่มีข้อมูลเพิ่มเติม'}</p>
                                            <div className="flex items-center justify-between mt-6 pt-4 border-t border-slate-50">
                                                <div className="flex gap-4 text-[10px] font-bold text-slate-400 uppercase">
                                                    <span className="flex items-center gap-1"><i data-lucide="calendar" className="w-3 h-3"/> {item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleDateString() : '-'}</span>
                                                    <span className="flex items-center gap-1"><i data-lucide="clock" className="w-3 h-3"/> {item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleTimeString() : '-'}</span>
                                                </div>
                                                <div className="w-2 h-2 rounded-full bg-indigo-500 shadow-lg shadow-indigo-200"></div>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </main>

                    {/* Floating FAB */}
                    <button 
                        onClick={() => setShowModal(true)}
                        className="fixed bottom-8 right-8 bg-indigo-600 text-white w-16 h-16 rounded-[1.5rem] shadow-2xl shadow-indigo-300 flex items-center justify-center hover:scale-110 active:scale-95 transition-all z-40"
                    >
                        <i data-lucide="plus" className="w-8 h-8"></i>
                    </button>

                    {/* Form Modal */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4 z-[100]">
                            <div className="bg-white w-full max-w-lg rounded-t-[3rem] md:rounded-[3rem] p-8 modal-animate shadow-2xl overflow-y-auto max-h-[95vh]">
                                <div className="flex justify-between items-center mb-8">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-900 leading-none">NEW LOG</h2>
                                        <p className="text-[10px] font-bold text-indigo-500 mt-1 uppercase tracking-widest">Capture Field Evidence</p>
                                    </div>
                                    <button onClick={() => setShowModal(false)} className="bg-slate-100 p-3 rounded-2xl text-slate-400 hover:text-slate-900"><i data-lucide="x"></i></button>
                                </div>
                                
                                <div className="space-y-6 safe-area-bottom">
                                    <div className="relative group">
                                        {!form.image ? (
                                            <label className="flex flex-col items-center justify-center w-full h-56 border-2 border-dashed border-slate-200 rounded-[2.5rem] bg-slate-50 cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all overflow-hidden">
                                                <div className="bg-white p-4 rounded-2xl shadow-sm mb-3">
                                                    <i data-lucide="camera" className="w-8 h-8 text-indigo-500"></i>
                                                </div>
                                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">แตะที่นี่เพื่อถ่ายภาพ</span>
                                                <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleFile} />
                                            </label>
                                        ) : (
                                            <div className="relative h-56 rounded-[2.5rem] overflow-hidden shadow-lg">
                                                <img src={form.image} className="w-full h-full object-cover" />
                                                <button onClick={() => setForm({...form, image: null})} className="absolute top-4 right-4 bg-white/90 p-2 rounded-xl text-red-500 shadow-xl"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                            </div>
                                        )}
                                    </div>

                                    <div className="space-y-3">
                                        <input 
                                            type="text" 
                                            placeholder="ชื่อหัวข้องาน / รหัสโครงการ" 
                                            className="w-full p-5 bg-slate-50 rounded-2xl outline-none border border-transparent focus:border-indigo-500 font-bold text-lg placeholder:text-slate-300 transition-all"
                                            value={form.title}
                                            onChange={e => setForm({...form, title: e.target.value})}
                                        />
                                        <textarea 
                                            placeholder="รายละเอียดหน้างาน (ถ้ามี)" 
                                            className="w-full p-5 bg-slate-50 rounded-2xl outline-none border border-transparent focus:border-indigo-500 font-medium placeholder:text-slate-300 transition-all resize-none"
                                            rows="2"
                                            value={form.detail}
                                            onChange={e => setForm({...form, detail: e.target.value})}
                                        />
                                    </div>

                                    <button 
                                        onClick={handleSave} 
                                        disabled={loading || !form.title || !form.image}
                                        className="w-full py-5 bg-indigo-600 text-white rounded-[2rem] font-black text-lg shadow-xl shadow-indigo-200 disabled:bg-slate-100 disabled:text-slate-300 disabled:shadow-none transition-all flex items-center justify-center gap-3 active:scale-95"
                                    >
                                        {loading ? <i data-lucide="loader-2" className="animate-spin w-5 h-5"></i> : <i data-lucide="upload-cloud" className="w-5 h-5"></i>}
                                        {loading ? "PROCESSING..." : "SUBMIT TO CLOUD"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
